# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=26.2
loader_version=0.19.3
loom_version=1.17-SNAPSHOT

# Mod Properties
# Release convention: bumping graal_version below REQUIRES bumping this minor version.
# Language mods (jscore-js-runtime etc.) depend on "~<minor>" and derive their Graal version
# from this build, so same-minor must mean same Graal or they will silently load a
# mismatched js-language against this Truffle.
version=1.0.0
group=ws.siri.jscore

# Dependencies
fabric_api_version=0.157.0+26.2
graal_version=25.2.4
